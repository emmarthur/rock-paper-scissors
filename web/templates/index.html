<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rock Paper Scissors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="bg-blob bg-blob-a" aria-hidden="true"></div>
    <div class="bg-blob bg-blob-b" aria-hidden="true"></div>

    <main class="page">
      <nav class="page-nav" aria-label="Page">
        <a class="nav-link" href="/help">Help</a>
      </nav>

      <header class="hero">
        <div class="hero-badge" aria-hidden="true">✊</div>
        <h1>Rock Paper Scissors</h1>
        <p class="tagline">Pick a move and face the computer — classic rules, best-of-luck rounds</p>
      </header>

      <section class="card score-card" aria-label="Score">
        <div class="score-grid">
          <div class="score-item">
            <span class="score-num" id="wins">0</span>
            <span class="score-label">Wins</span>
          </div>
          <div class="score-item">
            <span class="score-num" id="losses">0</span>
            <span class="score-label">Losses</span>
          </div>
          <div class="score-item">
            <span class="score-num" id="ties">0</span>
            <span class="score-label">Ties</span>
          </div>
        </div>
        <button type="button" id="btn-reset" class="btn btn-secondary btn-small">Reset score</button>
      </section>

      <section class="card arena-card" aria-live="polite">
        <p id="versus-line" class="versus-line">Choose your move</p>
        <p id="countdown" class="countdown" hidden></p>
        <p id="computer-reveal" class="computer-reveal" hidden></p>
        <p id="result-message" class="result-message" hidden></p>
        <p id="error-text" class="error" role="alert" hidden></p>
      </section>

      <section class="move-picker" aria-label="Your move">
        <button type="button" class="move-btn" data-move="rock" id="btn-rock">
          <span class="move-icon" aria-hidden="true">🪨</span>
          <span>Rock</span>
        </button>
        <button type="button" class="move-btn" data-move="paper" id="btn-paper">
          <span class="move-icon" aria-hidden="true">📄</span>
          <span>Paper</span>
        </button>
        <button type="button" class="move-btn" data-move="scissors" id="btn-scissors">
          <span class="move-icon" aria-hidden="true">✂️</span>
          <span>Scissors</span>
        </button>
      </section>
    </main>

    <script src="/static/session-persist.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
